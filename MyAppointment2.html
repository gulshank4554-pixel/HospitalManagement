<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment - Ballia Hospital</title>
  <link rel="stylesheet" href="mystyle2.css" />
  
</head>
<body>
  <header>
    <h1>Book Your Appointment</h1>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
      </ul>
    </nav>
  </header>

<main style="padding: 2rem;">
  <h2>Book Your Appointment</h2>
  <form id="appointmentForm" style="max-width: 1000px; margin: auto;">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required />

    <label for="contact">Contact Number:</label>
    <input type="tel" id="contact" name="contact" required />

    <label for="date">Preferred Date:</label>
    <input type="date" id="date" name="date" required />

    <label for="department">Department:</label>
    <select id="department" name="department" required>
      <option value="">Select</option>
      <option value="general">General Medicine</option>
      <option value="emergency">Emergency</option>
      <option value="neurology">Neurology</option>
      <option value="pediatrics">Pediatrics</option>
    </select><br>

    <label for="symptoms">Symptoms Description:</label>
    <textarea id="symptoms" name="symptoms" rows="4" required></textarea>

    <button type="submit" class="btn">Submit Appointment</button>
  </form>
</main>

  <footer>
    <p>&copy; 2025 Praveen Hospital | All rights reserved</p>
  </footer>
</body>
</html>
